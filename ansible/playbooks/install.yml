---
- name: Install Hermes SEG via existing installer
  hosts: hermes_hosts
  become: true
  gather_facts: false
  vars:
    hermes_repo_root: "{{ playbook_dir | dirname | dirname }}"
    hermes_required_script: "install_hermes_docker.sh"
    hermes_installer_state_values:
      - name: "03-host-ip-confirmed"
        value: "{{ hermes_host_ip }}"
      - name: "04-mail-hostname-confirmed"
        value: "{{ hermes_mail_hostname }}"
      - name: "04-mail-domain-confirmed"
        value: "{{ hermes_mail_domain }}"
      - name: "05-console-host-confirmed"
        value: "{{ hermes_console_host_effective }}"
      - name: "03b-dns-forwarders-configured"
        value: "{{ hermes_dns_forwarders_csv }}"
  pre_tasks:
    - name: Load generated Hermes vars
      ansible.builtin.import_tasks: "{{ hermes_repo_root }}/ansible/tasks/load_vars.yml"

    - name: Derive effective install values
      ansible.builtin.set_fact:
        hermes_console_host_effective: "{{ hermes_console_host | default(hermes_host_ip | default('')) }}"
        hermes_dns_forwarders_csv: >-
          {{ hermes_dns_forwarders if hermes_dns_forwarders is string else (hermes_dns_forwarders | default([]) | join(',')) }}

    - name: Validate install variables
      ansible.builtin.assert:
        that:
          - hermes_eula_accepted | default(false) | bool
          - (hermes_host_ip | default('')) | length > 0
          - hermes_host_ip != '192.0.2.10'
          - (hermes_mail_hostname | default('')) | length > 0
          - hermes_mail_hostname != 'smtp.example.com'
          - (hermes_mail_domain | default('')) | length > 0
          - hermes_mail_domain != 'example.com'
          - (hermes_dns_forwarders_csv | default('')) | length > 0
          - (hermes_data_mount | default('')) | length > 0
          - (hermes_archive_mount | default('')) | length > 0
          - (hermes_vmail_mount | default('')) | length > 0
          - (hermes_files_mount | default('')) | length > 0
        fail_msg: "Populate ansible/vars/hermes.yml with real install values via ./hermes_exec configure before running install."

  tasks:
    - name: Display Hermes EULA notice for Ansible-driven installs
      ansible.builtin.debug:
        msg:
          - "Hermes Pro EULA: https://docs.hermesseg.io/books/hermes-secure-email-gateway-general-documentation/page/hermes-secure-email-gateway-pro-end-user-license-agreement-eula"
          - "Set hermes_eula_accepted: true in ansible/vars/hermes.yml only after reviewing and accepting that EULA."

    - name: Ensure installer state directory exists
      ansible.builtin.file:
        path: "{{ hermes_root_effective }}/.install-state"
        state: directory
        mode: "0755"

    - name: Seed installer mount configuration values
      ansible.builtin.lineinfile:
        path: "{{ hermes_root_effective }}/.hermes_install_config"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value | quote }}"
        create: true
        mode: "0644"
      loop:
        - { key: "DATA_MOUNT", value: "{{ hermes_data_mount }}" }
        - { key: "ARCHIVE_MOUNT", value: "{{ hermes_archive_mount }}" }
        - { key: "VMAIL_MOUNT", value: "{{ hermes_vmail_mount }}" }
        - { key: "FILES_MOUNT", value: "{{ hermes_files_mount }}" }
        - { key: "ENABLE_NEXTCLOUD", value: "{{ 'true' if (hermes_enable_nextcloud | default(false) | bool) else 'false' }}" }
        - { key: "HERMES_ROOT", value: "{{ hermes_root_effective }}" }

    - name: Seed installer state values
      ansible.builtin.copy:
        dest: "{{ hermes_root_effective }}/.install-state/{{ item.name }}.value"
        mode: "0644"
        content: "{{ item.value }}"
      loop: "{{ hermes_installer_state_values }}"

    - name: Seed installer state markers
      ansible.builtin.copy:
        dest: "{{ hermes_root_effective }}/.install-state/{{ item }}.done"
        mode: "0644"
        content: ""
        force: false
      loop:
        - "00-eula-accepted"

    - name: Run installer
      ansible.builtin.command:
        argv:
          - bash
          - "{{ hermes_root_effective }}/scripts/install_hermes_docker.sh"
      args:
        chdir: "{{ hermes_root_effective }}"
      environment:
        HERMES_DIR: "{{ hermes_root_effective }}"
        HERMES_ROOT: "{{ hermes_root_effective }}"
        HERMES_INSTALL_AUTO_CONFIRM: "1"
        HERMES_INSTALL_PRESEEDED: "1"
        TERM: xterm
      register: hermes_install
      changed_when: true

    - name: Show installer output
      ansible.builtin.debug:
        var: hermes_install.stdout_lines
