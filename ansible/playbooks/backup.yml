---
- name: Run Hermes backup
  hosts: hermes_hosts
  become: true
  gather_facts: false
  vars:
    hermes_repo_root: "{{ playbook_dir | dirname | dirname }}"
    hermes_required_script: "system_backup.sh"
  pre_tasks:
    - name: Load generated Hermes vars
      ansible.builtin.import_tasks: "{{ hermes_repo_root }}/ansible/tasks/load_vars.yml"

    - name: Validate backup arguments
      ansible.builtin.assert:
        that:
          - (backup_path | default('')) | length > 0
          - (backup_scope | default('')) in ['system', 'archive', 'vmail', 'nextcloud', 'all']
        fail_msg: "Set backup_path and backup_scope when running the backup playbook."

  tasks:
    - name: Run backup script
      ansible.builtin.command:
        argv: "{{ ['bash', hermes_root_effective + '/scripts/system_backup.sh', '-P', backup_path, '-B', backup_scope] + (['--cold'] if (backup_cold | default(false) | bool) else []) + (['--no-nc-maintenance'] if (backup_no_nc_maintenance | default(false) | bool) else []) + (['--yes'] if (hermes_yes | default(false) | bool) else []) + (['--dry-run'] if (hermes_dry_run | default(false) | bool) else []) }}"
      args:
        chdir: "{{ hermes_root_effective }}"
      environment:
        HERMES_ROOT: "{{ hermes_root_effective }}"
      register: hermes_backup
      changed_when: not (hermes_dry_run | default(false) | bool)

    - name: Show backup output
      ansible.builtin.debug:
        var: hermes_backup.stdout_lines
