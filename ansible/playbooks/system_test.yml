---
- name: Run Hermes smoke test
  hosts: hermes_hosts
  become: true
  gather_facts: false
  vars:
    hermes_repo_root: "{{ playbook_dir | dirname | dirname }}"
  pre_tasks:
    - name: Load generated Hermes vars
      ansible.builtin.import_tasks: "{{ hermes_repo_root }}/ansible/tasks/load_vars.yml"

  tasks:
    - name: Run Hermes smoke test script
      ansible.builtin.command:
        argv:
          - bash
          - "{{ hermes_root_effective }}/scripts/hermes_smoke_test.sh"
      args:
        chdir: "{{ hermes_root_effective }}"
      environment:
        HERMES_DIR: "{{ hermes_root_effective }}"
        HERMES_ROOT: "{{ hermes_root_effective }}"
      register: hermes_smoke_test
      changed_when: false
      failed_when: false

    - name: Show smoke test output
      ansible.builtin.debug:
        var: hermes_smoke_test.stdout_lines

    - name: Fail when smoke test reports errors
      ansible.builtin.fail:
        msg: |-
          Hermes smoke test failed with rc={{ hermes_smoke_test.rc }}.
          stdout:
          {{ (hermes_smoke_test.stdout | default('')) | trim }}
          stderr:
          {{ (hermes_smoke_test.stderr | default('')) | trim }}
      when: hermes_smoke_test.rc != 0
